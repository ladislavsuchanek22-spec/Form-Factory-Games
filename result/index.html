<script>
(function(){
  const tv=/[?&]tv\b/.test(location.search); if(tv)document.body.classList.add('tv');
  let lastUpd=null,lastWave=null;
  const $=id=>document.getElementById(id);
  function fit(){ if(!tv)return; const rows=Math.max(...[...document.querySelectorAll('.lb tbody')].map(t=>t.rows.length),1);
    const free=innerHeight-document.querySelector('.bar').offsetHeight-36-90; const h=Math.max(22,Math.min(60,Math.floor(free/rows)));
    document.documentElement.style.setProperty('--rowh',h+'px'); }
  function draw(s){
    const done=s.athletes.filter(a=>s.scores[a.no]).length;
    $('prog').textContent=done+' / '+s.athletes.length;
    const fresh=(lastUpd&&s.updated!==lastUpd)?s.lastWave:null;
    HG.boards(s,$('boards'),fresh);
    $('empty').hidden=s.athletes.length>0;
    if(!s.athletes.length)$('empty').textContent='Soupiska se připravuje. Výsledky se objeví po zapsání první vlny.';
    $('last').innerHTML=s.lastWave?'Poslední zapsaná vlna: <b>'+s.lastWave+'</b>':'';
    lastUpd=s.updated; fit();
  }
  async function tick(){ try{ const s=await HG.load(); $('live').classList.remove('off'); if(s.updated!==lastUpd||lastUpd===null)draw(s);}catch(e){ $('live').classList.add('off'); } }
  function clock(){const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  addEventListener('resize',fit);
  tick();setInterval(tick,5000);clock();setInterval(clock,15000);
})();
</script>
