<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TV · Form Factory Hybrid Games</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700;800&family=Barlow+Condensed:ital,wght@1,900&display=swap">
<style>
/* TV v hale: levá polovina časomíra, pravá nahoře vlna na přípravu, pravá dole výsledky. Barvy Form Factory. */
:root{--bg:#000;--p1:#111;--p2:#222;--line:#333;--fg:#fff;--mut:#A4A4A4;--red:#C41D3E;--red-dk:#A20F2B;--gold:#C9A950;
--f:"Roboto Condensed","Arial Narrow",Arial,sans-serif;--fm:"Barlow Condensed","Arial Narrow",sans-serif;--u:min(1vw,1.78vh);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font:400 calc(var(--u)*1.4)/1.3 var(--f)}
.tv{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.4)}
/* hlavička přes celou šířku */
.top{grid-column:1/-1;display:flex;align-items:center;gap:calc(var(--u)*2)}
.lg{display:flex;flex-direction:column;align-items:flex-start;width:calc(var(--u)*11)}
.lg svg{width:100%;height:auto;display:block;color:#fff}
.lg .by{display:flex;align-items:center;gap:.3em;padding-left:34.4%;margin-top:.25em;font:300 calc(var(--u)*.7)/1 var(--f);letter-spacing:.2em;color:#bbb}
.lg .by b{font:italic 900 calc(var(--u)*1.05)/1 var(--fm);letter-spacing:0;color:#fff}
.lg .by b i{font-style:inherit;color:var(--gold)}
.top h1{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:300 calc(var(--u)*2.6)/1 var(--f)}
.top h1 strong{font-weight:800;text-transform:uppercase}
.wall{flex:none;font:800 calc(var(--u)*2.6)/1 var(--f);font-variant-numeric:tabular-nums}
.wall small{display:block;font:700 calc(var(--u)*.8)/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:.3em;text-align:right}
.dot{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--red);margin-right:.35em;vertical-align:middle;animation:p 1.6s infinite}
.dot.off{background:#666;animation:none}
@keyframes p{50%{opacity:.25}}

/* levá polovina: časomíra */
.clock{grid-row:2;min-width:0;overflow:hidden;background:var(--p1);border-radius:0 10px 10px 10px;display:flex;flex-direction:column;padding:calc(var(--u)*2);min-height:0}
.ph{font:800 calc(var(--u)*3.4)/1 var(--f);text-transform:uppercase;letter-spacing:.06em}
.ph.work{color:#fff}.ph.move{color:var(--mut)}
.ph small{display:block;font:400 calc(var(--u)*1.5)/1.2 var(--f);letter-spacing:.02em;text-transform:none;color:var(--mut);margin-top:.35em}
.big{flex:1;display:flex;align-items:center;justify-content:center;white-space:nowrap;min-height:0;font:800 calc(var(--u)*17)/.85 var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big.move{color:var(--mut)}
.big.last{color:var(--red)}
.prog{height:calc(var(--u)*1.1);background:#2a2a2a;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red)}
.prog.move i{background:#777}
.stations{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*.8);margin-top:calc(var(--u)*1.6)}
.stations div{background:var(--p2);border-radius:0 8px 8px 8px;padding:calc(var(--u)*.9) calc(var(--u)*1);text-align:center}
.stations b{display:block;font:800 calc(var(--u)*2)/1 var(--f);color:#fff}
.stations span{display:flex;align-items:center;justify-content:center;min-height:3.6em;font:700 calc(var(--u)*.85)/1.2 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:.4em}
.stations em{display:block;font:800 calc(var(--u)*1.7)/1 var(--f);font-style:normal;margin-top:.35em;font-variant-numeric:tabular-nums}
.stations em.no{color:#555}

/* pravá polovina */
.right{grid-row:2;min-width:0;display:grid;grid-template-rows:auto 1fr;gap:calc(var(--u)*1.2);min-height:0}
.prep{background:var(--red);border-radius:0 10px 10px 10px;padding:calc(var(--u)*1.5) calc(var(--u)*1.8)}
.prep .h{display:flex;justify-content:space-between;align-items:baseline;gap:1em}
.prep .h b{font:800 calc(var(--u)*1.2)/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:#FFE1E7}
.prep .h span{font:700 calc(var(--u)*1.2)/1 var(--f);letter-spacing:.06em;text-transform:uppercase;color:#FFE1E7;font-variant-numeric:tabular-nums}
.prep .w{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5em;margin:.15em 0 .35em}
.prep .w strong{font:800 calc(var(--u)*4.4)/1 var(--f);text-transform:uppercase}
.prep .w em{white-space:nowrap;font:800 calc(var(--u)*3)/1 var(--f);font-style:normal;font-variant-numeric:tabular-nums;margin-left:auto}
.prep .w em small{font:700 calc(var(--u)*.9)/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:#FFE1E7;margin-right:.5em;vertical-align:middle}
.lanes{display:grid;grid-template-columns:1fr;gap:calc(var(--u)*.3)}
.lanes div{display:flex;align-items:baseline;gap:.8em;border-top:1px solid rgba(255,255,255,.3);padding-top:.3em;min-width:0}
.lanes i{min-width:5.5em;font:700 calc(var(--u)*.85)/1 var(--f);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:#FFE1E7;white-space:nowrap}
.lanes b{font:800 calc(var(--u)*1.55)/1.1 var(--f);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lanes b small{font-weight:400;color:#FFD5DE;margin-right:.4em}
.prep.calm{background:var(--p2)}
.prep.calm .h b,.prep.calm .h span{color:var(--mut)}
.prep .note{font:700 calc(var(--u)*1.6)/1.2 var(--f)}

.res{background:var(--p1);border-radius:0 10px 10px 10px;padding:calc(var(--u)*1.2);min-height:0;display:flex;flex-direction:column}
.res .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:calc(var(--u)*.6)}
.res .h b{font:800 calc(var(--u)*1.2)/1 var(--f);letter-spacing:.16em;text-transform:uppercase}
.res .h span{font:700 calc(var(--u)*.9)/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.2);min-height:0}
.col{min-height:0;display:flex;flex-direction:column}
.col .ch{background:var(--red);padding:.35em .6em;border-radius:0 6px 0 0;display:flex;justify-content:space-between;align-items:baseline}
.col .ch b{font:800 calc(var(--u)*1.4)/1 var(--f);text-transform:uppercase;letter-spacing:.04em}
.col .ch span{font:700 calc(var(--u)*.8)/1 var(--f);letter-spacing:.1em;color:#FFE1E7}
.list{flex:1;min-height:0;overflow:hidden}
.r{display:grid;grid-template-columns:2.1em 1fr auto;align-items:center;gap:.5em;height:var(--rh,2.2em);border-bottom:1px solid #262626;font-size:calc(var(--u)*1.25);font-variant-numeric:tabular-nums}
.r .pos{font-weight:800;text-align:center}
.r.top .pos{background:var(--red);height:100%;display:grid;place-items:center}
.r .n{font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .n small{font-weight:400;color:var(--mut);margin-right:.45em}
.r .t{font-weight:800;padding-right:.3em}
.r.new{animation:hl 3s ease-out}
@keyframes hl{from{background:rgba(196,29,62,.55)}}
.page{font:700 calc(var(--u)*.8)/1 var(--f);letter-spacing:.12em;color:var(--mut);text-align:right;margin-top:.4em;min-height:1em}
.empty{color:var(--mut);font-size:calc(var(--u)*1.4);padding:1em 0}
@media (prefers-reduced-motion:reduce){.dot,.r.new{animation:none}}
/* na výšku (mobil) pod sebe */
@media (max-aspect-ratio:1/1){html,body{overflow:auto}.tv{height:auto;grid-template-columns:1fr}.clock,.right{grid-row:auto}.big{min-height:40vh}.list{overflow:visible}:root{--u:2.4vw}}
</style>
</head>
<body>
<div class="tv">
  <header class="top">
    <div class="lg" aria-label="Form Factory by STR2G"><svg viewBox="0 22.6 162 39.8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="currentColor"><polygon points="55.82 37.63 58.5 37.63 58.5 31.63 65.14 31.63 65.14 29.43 58.5 29.43 58.5 26.13 68.08 26.13 68.08 23.88 55.82 23.88 55.82 37.63"/><polygon points="55.82 53.82 58.5 53.82 58.5 47.82 65.14 47.82 65.14 45.62 58.5 45.62 58.5 42.32 68.08 42.32 68.08 40.07 55.82 40.07 55.82 53.82"/><path d="M100.72,27.98c0-.66-.11-1.28-.34-1.85-.25-.6-.63-1.08-1.13-1.43-.44-.3-.97-.51-1.57-.63-.61-.12-1.43-.18-2.47-.18h-7.81v13.74h2.68v-5.6h3.91l3.87,5.6h2.92l-3.93-5.72c2.57-.38,3.85-1.69,3.85-3.93M94.9,29.75h-4.8v-3.62h4.8c.71,0,1.21.02,1.5.06s.56.13.82.26c.57.27.84.77.84,1.5s-.28,1.21-.84,1.49c-.27.12-.55.2-.84.24-.29.04-.79.06-1.48.06"/><polygon points="116.71 23.89 111.88 32.13 107.31 23.89 103.95 23.89 103.95 37.62 106.4 37.62 106.4 28.14 111.62 37.44 117.15 28.14 117.15 37.62 119.83 37.62 119.83 23.89 116.71 23.89"/><path d="M80.56,23.74h-7.11c-1.91,0-3.47,1.55-3.47,3.46v7.11c0,1.91,1.56,3.46,3.47,3.46h7.12c1.91,0,3.46-1.55,3.46-3.46v-7.11c0-1.91-1.55-3.46-3.47-3.46M81.47,33.67c0,1.28-.83,1.83-1.78,1.83h-5.37c-1.01,0-1.77-.58-1.77-1.83v-5.82c0-1.18.85-1.85,1.77-1.85h5.37c.9,0,1.78.64,1.78,1.85v5.82Z"/><path d="M147.26,44.15c0-.66-.11-1.28-.34-1.85-.25-.6-.63-1.08-1.13-1.43-.44-.3-.97-.51-1.57-.63-.61-.12-1.43-.18-2.47-.18h-7.81v13.74h2.68v-5.6h3.91l3.87,5.6h2.92l-3.93-5.72c2.57-.38,3.85-1.69,3.85-3.93M141.44,45.92h-4.8v-3.62h4.8c.71,0,1.21.02,1.5.06.29.04.56.13.82.26.57.27.84.77.84,1.5s-.28,1.21-.84,1.49c-.27.12-.55.2-.84.24-.29.04-.79.06-1.48.06"/><path d="M127.1,39.91h-7.11c-1.91,0-3.47,1.55-3.47,3.46v7.11c0,1.91,1.56,3.46,3.47,3.46h7.12c1.91,0,3.46-1.55,3.46-3.46v-7.11c0-1.91-1.55-3.46-3.47-3.46M128.01,49.84c0,1.28-.83,1.83-1.78,1.83h-5.37c-1.01,0-1.77-.58-1.77-1.83v-5.82c0-1.18.85-1.85,1.77-1.85h5.37c.89,0,1.78.64,1.78,1.85v5.82Z"/><polygon points="82.68 53.82 76.13 40.07 73.72 40.07 67.18 53.82 70.05 53.82 74.93 43.44 79.8 53.82 82.68 53.82"/><polygon points="100.88 42.31 106.4 42.31 106.4 53.8 109.07 53.8 109.07 47.81 109.07 45.62 109.07 42.31 114.59 42.31 114.59 40.05 100.88 40.05 100.88 42.31"/><path d="M98.5,51.52h-9.33c-.98,0-1.72-.56-1.72-1.77v-5.64c0-1.14.82-1.79,1.72-1.79h9.33v-2.25h-10.21c-1.87,0-3.39,1.52-3.39,3.38v6.95c0,1.86,1.52,3.38,3.39,3.38h10.21v-2.27h0Z"/><polygon points="158.99 40.07 155.16 45.49 151.4 40.07 148.23 40.07 153.78 48.07 153.78 53.82 156.47 53.82 156.47 48.07 162 40.07 158.99 40.07"/><polygon points="28.31 23.08 0 23.08 0 51.39 6.47 51.39 6.47 29.55 28.31 29.55 28.31 23.08"/><polygon points="38.83 33.6 10.52 33.6 10.52 61.92 16.99 61.92 16.99 40.07 38.83 40.07 38.83 33.6"/><rect x="21.03" y="44.11" width="6.47" height="6.47"/></g></svg><div class="by">BY <b>STR<i>2</i>G</b></div></div>
    <h1>Form Factory <strong>Hybrid Games</strong></h1>
    <div class="wall"><small><span class="dot" id="dot"></span>Čas</small><span id="wall">–</span></div>
  </header>

  <section class="clock" aria-label="Časomíra">
    <div class="ph" id="ph">Časomíra<small id="phs">Načítám…</small></div>
    <div class="big" id="big">–:––</div>
    <div class="prog" id="prog"><i id="bar"></i></div>
    <div class="stations" id="stations"></div>
  </section>

  <div class="right">
    <section class="prep" id="prep" aria-live="polite"></section>
    <section class="res" aria-label="Výsledky">
      <div class="h"><b>Průběžné výsledky</b><span id="done">–</span></div>
      <div class="cols" id="cols"></div>
    </section>
  </div>
</div>
<script src="/result/app.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id), esc=HG.esc, ST=HG.ST, SHORT=['SkiErg · Wall balls','Bike · Snatch','Sled','Row · Burpees','Shuttle · Lunges'];
let S=null, lastUpd=null, fresh=null, pageI=0;

const DAYS=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const day=ms=>{const d=new Date(ms);return DAYS[d.getDay()][0].toUpperCase()+DAYS[d.getDay()].slice(1)+' '+d.getDate()+'. '+(d.getMonth()+1)+'.'};
const far=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+' d '+h+' h':h+' h '+m+' min'};
function fitBig(){const b=$('big'),w=b.clientWidth,h=b.clientHeight,n=Math.max(4,b.textContent.length);
  b.style.fontSize=Math.max(40,Math.min(w/(n*.58),h*1.05))+'px'}
function drawClock(){
  const t=HG.now(), d=new Date(t);
  $('wall').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  if(!S)return;
  const R=HG.race(S,t), ph=$('ph'), big=$('big'), prog=$('prog');
  big.className='big';ph.className='ph';prog.className='prog';
  if(R.phase==='pre'){
    if(R.left>3600){ph.innerHTML='Start závodu<small>'+day(S.timer.t0)+' · za '+far(R.left)+'</small>';big.textContent=HG.hhmm(S.timer.t0)}
    else{ph.innerHTML='Do startu<small>Start vlny 1 v '+HG.hhmm(S.timer.t0)+'</small>';big.textContent=HG.mmss(R.left)}
    $('bar').style.width='0%'}
  else if(R.phase==='done'){ph.innerHTML='Závod skončil<small>Všechny vlny dojely</small>';big.textContent='0:00';$('bar').style.width='100%'}
  else{
    const work=R.phase==='work';
    ph.classList.add(work?'work':'move');
    ph.innerHTML=(work?'Práce':'Přesun')+'<small>'+(work?'4 minuty na stanovišti':'Zápis, přesun na další stanoviště')+' · blok '+(R.n+1)+' z '+(R.waves+4)+'</small>';
    big.textContent=HG.mmss(R.left);
    if(!work)big.classList.add('move'); else if(R.left<=10)big.classList.add('last');
    if(!work)prog.classList.add('move');
    $('bar').style.width=Math.min(100,R.frac*100)+'%';
  }
  fitBig();
  $('stations').innerHTML=ST.map((s,i)=>'<div><b>'+s.k+'</b><span>'+SHORT[i]+'</span><em class="'+(R.st[i]?'':'no')+'">'+(R.st[i]?'Vlna '+R.st[i]:'–')+'</em></div>').join('');
  drawPrep(R,t);
}
function drawPrep(R,t){
  const el=$('prep');
  if(!R.prep){el.className='prep calm';el.innerHTML='<div class="h"><b>Příprava</b><span></span></div><p class="note">'+(R.phase==='done'?'Díky všem! Vyhlášení za chvíli.':'Všechny vlny už odstartovaly.')+'</p>';return}
  const L=S.athletes.filter(a=>a.wave===R.prep).sort((p,q)=>p.lane-q.lane);
  el.className='prep';
  el.innerHTML='<div class="h"><b>Připraví se na start · stanoviště A</b><span>Start '+HG.hhmm(R.startOf(R.prep))+'</span></div>'+
    '<div class="w"><strong>Vlna '+R.prep+'</strong><em><small>start za</small>'+(R.prepIn>3600?far(R.prepIn):HG.mmss(R.prepIn))+'</em></div>'+
    '<div class="lanes">'+(L.length?L.map(a=>'<div><i>Dráha '+a.lane+'</i><b><small>'+a.no+'</small>'+esc(a.name)+'</b></div>').join(''):'<div><b>Soupiska se připravuje</b></div>')+'</div>';
}
function drawRes(){
  if(!S)return;
  const done=S.athletes.filter(a=>S.scores[a.no]).length;
  $('done').textContent=done+' / '+S.athletes.length+' zapsáno';
  const cols=$('cols');cols.innerHTML='';
  [['W','Ženy'],['M','Muži']].forEach(([cat,lbl])=>{
    const {rows,N,total}=HG.rank(S,cat); if(!total)return;
    const c=document.createElement('div');c.className='col';
    c.innerHTML='<div class="ch"><b>'+lbl+'</b><span>'+N+' / '+total+'</span></div><div class="list"></div><div class="page"></div>';
    cols.appendChild(c);
    const list=c.querySelector('.list');
    if(!rows.length){list.innerHTML='<p class="empty">Čeká na první vlnu</p>';return}
    const h=list.clientHeight, rh=Math.max(26,Math.min(54,h/Math.min(rows.length,10)));
    const per=Math.max(1,Math.floor(h/rh)), pages=Math.ceil(rows.length/per), pi=pageI%pages;
    list.style.setProperty('--rh',rh+'px');
    list.innerHTML=rows.slice(pi*per,pi*per+per).map(r=>'<div class="r'+(r.pos<=3?' top':'')+(fresh&&r.a.wave===fresh?' new':'')+'"><span class="pos">'+r.pos+'</span><span class="n"><small>'+r.a.no+'</small>'+esc(r.a.name)+'</span><span class="t">'+HG.f1(r.t)+'</span></div>').join('');
    c.querySelector('.page').textContent=pages>1?'strana '+(pi+1)+' / '+pages:'';
  });
  if(!S.athletes.length)cols.innerHTML='<p class="empty">Výsledky se objeví po zapsání první vlny.</p>';
}
async function tick(){
  try{const s=await HG.load();$('dot').classList.remove('off');
    if(lastUpd&&s.updated!==lastUpd)fresh=s.lastWave; else fresh=null;
    const changed=s.updated!==lastUpd; S=s; lastUpd=s.updated; if(changed)drawRes();}
  catch(e){$('dot').classList.add('off')}
}
setInterval(drawClock,200);
setInterval(tick,5000);
setInterval(()=>{pageI++;fresh=null;drawRes()},10000);
addEventListener('resize',drawRes);
tick().then(()=>{drawClock();drawRes()});
})();
</script>
</body>
</html>
