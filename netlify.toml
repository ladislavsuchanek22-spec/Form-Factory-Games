[build]
  publish = "."
  command = ""

# www a stará Netlify adresa -> hlavní doména, aby Google indexoval jen formfactorygames.cz
[[redirects]]
  from = "https://www.formfactorygames.cz/*"
  to = "https://formfactorygames.cz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://form-factory-games.netlify.app/*"
  to = "https://formfactorygames.cz/:splat"
  status = 301
  force = true

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Web je zatím schovaný před vyhledávači (přání Ládi). Pro zpětné zapnutí smaž tenhle blok a meta robots noindex v _build/build.py a _build/articles.py.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
